name: Terraform AWS Infrastructure

on:
  push:
    branches:
      - main

jobs:
  terraform-plan:
    runs-on: ubuntu-latest



    env:
      TF_VAR_aws_region: ${{ secrets.TF_VAR_aws_region }}
      TF_VAR_environment: ${{ secrets.TF_VAR_environment }}
      TF_VAR_vpc_cidr: ${{ secrets.TF_VAR_vpc_cidr }}
      TF_VAR_public_subnet_1: ${{ secrets.TF_VAR_public_subnet_1 }}
      TF_VAR_public_subnet_2: ${{ secrets.TF_VAR_public_subnet_2 }}
      TF_VAR_instance_type: ${{ secrets.TF_VAR_instance_type }}
      TF_VAR_ami_id: ${{ secrets.TF_VAR_ami_id }}



    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="aws_region=us-east-1" \
            -var="environment=dev" \
            -var="vpc_cidr=10.0.0.0/16" \
            -var="public_subnet_1=10.0.1.0/24" \
            -var="public_subnet_2=10.0.2.0/24" \
            -var="instance_type=t2.micro" \
            -var="ami_id=ami-0c02fb55956c7d316" \
            -lock=false \
            -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
